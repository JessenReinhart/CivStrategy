<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivStrategy — Ancient Realms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap');

      :root {
        --dust-white: #F5F1E8;
        --parchment: #E6DCC4;
        --limestone: #C9BFA6;
        --sandstone: #8C7E66;
        --shadow: #1A1612;
        --obsidian: #2E2824;
        --gold-leaf: #D4AF37;
        --amber-glow: #FFDF8F;
        --dust-particle: #B8A88A;
        --terracotta: #8B5A2B;
        --hud-ink: rgba(12, 11, 10, .88);
        --hud-line: rgba(230, 220, 196, .16);
        --hud-muted: rgba(245, 241, 232, .62);
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: #0F0C0A;
        color: var(--dust-white);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .hud-surface {
        background: linear-gradient(180deg, rgba(25, 22, 18, .92), rgba(10, 9, 8, .88));
        border: 1px solid var(--hud-line);
        box-shadow: 0 18px 48px rgba(0, 0, 0, .28), inset 0 1px rgba(255,255,255,.04);
        backdrop-filter: blur(16px) saturate(115%);
      }
      .hud-kicker {
        color: var(--hud-muted);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      .hud-rule { background: var(--hud-line); }

      /*
       * HUD collision lanes.
       * GameUI currently owns several independent absolute overlays. Keep the
       * transient event rail beside the system-controls lane rather than under
       * it, and keep popovers from growing through neighboring HUD elements.
       */
      body .absolute.top-20.right-4:has(> .hud-kicker) {
        top: 6rem !important;
        right: 23rem !important;
      }

      /* Tax opens to the left of the system-controls cluster. */
      body .absolute.top-6.right-6 .relative > .absolute.top-12.right-0.w-64 {
        top: 0 !important;
        right: calc(100% + .75rem) !important;
      }

      /* The menu is an overlay, not another item that lengthens the right rail. */
      body .absolute.top-6.right-6 > .hud-surface.w-56 {
        position: absolute !important;
        top: 4rem !important;
        right: 0 !important;
      }

      /* Diplomacy is already represented in the resource bar. Remove the
         duplicate large widget from the contested top-right rail. */
      body .absolute.top-6.right-6 > .flex.items-center.gap-3.px-4.py-2.rounded-full {
        display: none !important;
      }

      @media (max-width: 760px) {
        body .absolute.top-20.right-4:has(> .hud-kicker) {
          top: 7.5rem !important;
          left: 1rem !important;
          right: auto !important;
          width: min(18rem, calc(100vw - 2rem)) !important;
        }
      }

      /* Disable selection on game container to prevent UI text selection while dragging */
      #game-container { user-select: none; }
      @keyframes shrink-toast-bar {
        from { width: 100%; }
        to { width: 0%; }
      }
      .shrink-toast-bar {
        animation: shrink-toast-bar linear forwards;
      }
      @keyframes age-celebration {
        0% { opacity: 0; transform: translateY(-30px) scale(0.8); }
        15% { opacity: 1; transform: translateY(0) scale(1.05); }
        25% { transform: translateY(0) scale(1); }
        85% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-10px); }
      }
      .age-celebration-banner { animation: age-celebration 5s ease-out forwards; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react/": "https://esm.sh/react@^19.2.3/",

  }
}
</script>
</head>

    <div id="root"></div>

  </body>
