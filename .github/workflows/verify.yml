name: Code Verification

on:
  push:
    branches: [ main, develop, feat/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript type check (strict, full output)
        run: |
          echo "Running TypeScript compiler with full error output..."
          npx tsc --noEmit 2>&1 | tee tsc-output.txt
          # Filter out known acceptable errors
          grep -v "vite.config.d.ts" tsc-output.txt > tsc-filtered.txt || true
          if [ -s tsc-filtered.txt ]; then
            echo "❌ TypeScript errors found:"
            cat tsc-filtered.txt
            exit 1
          fi
          echo "✅ TypeScript check passed"
      
      - name: ESLint check
        run: npm run lint
      
      - name: Run tests
        run: npm run test
      
      - name: Fallow - Dead code detection
        run: |
          echo "Checking for unused code with Fallow..."
          npx fallow dead-code --format json > fallow-dead.json || true
          # Show summary (non-blocking for now, can be made blocking later)
          if [ -s fallow-dead.json ]; then
            echo "⚠️  Fallow found potential unused code:"
            cat fallow-dead.json
          else
            echo "✅ No unused code detected"
          fi
      
      - name: Fallow - Full analysis
        run: |
          echo "Running full Fallow analysis..."
          npx fallow > fallow-report.txt || true
          cat fallow-report.txt
      
      - name: Build check
        run: npm run build
