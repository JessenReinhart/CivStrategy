name: Code Verification

on:
  push:
    branches: [ main, develop, feat/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript type check
        run: npx tsc --noEmit
      
      - name: ESLint check
        run: npm run lint
      
      - name: Run tests
        run: npm run test
      
      - name: Fallow - Dead code detection
        run: |
          echo "Checking for unused code with Fallow..."
          npx fallow dead-code --format json > fallow-dead.json || true
          node scripts/fallow-summary.mjs fallow-dead.json || true

      - name: Fallow - Full analysis
        run: |
          echo "Running full Fallow analysis..."
          npx fallow || true
      
      - name: Build check
        run: npm run build

      - name: Install Chromium for gameplay acceptance
        run: npx playwright install --with-deps chromium

      - name: Browser repeated standard world startup journey
        run: node scripts/standard-world-start-journey.mjs

      - name: Browser gather to real building placement journey
        run: node scripts/canonical-gather-build-journey.mjs

      - name: Browser real player building placement journey
        run: node scripts/player-building-placement-journey.mjs

      - name: Browser real player build to train journey
        run: node scripts/player-build-train-journey.mjs

      - name: Browser real placement training save reload bridge
        run: node scripts/real-placement-training-save-journey.mjs

      - name: Browser one-session placement combat save reload gauntlet
        run: node scripts/canonical-placement-combat-save-journey.mjs

      # Keep independent canonical gather/combat/persistence evidence ahead of the long integrated
      # session so a late state-coupling failure does not hide whether these player contracts work alone.
      - name: Browser villager gathering journey
        run: npm run test:villager-gather-journey

      - name: Browser save reload journey
        run: npm run test:save-reload-journey

      - name: Browser villager carry reload continuity
        run: node scripts/villager-carry-save-reload-journey.mjs

      - name: Browser army combat journey
        run: npm run test:army-combat-journey

      - name: Browser combat save continuity journey
        run: npm run test:combat-save-continuity

      - name: Browser same-session economy progression journey
        run: node scripts/economy-progression-journey.mjs

      - name: Browser placement journey
        run: npm run test:placement-journey

      - name: Browser building demolition journey
        run: node scripts/building-demolition-journey.mjs

      - name: Browser large map loading journey
        run: npm run test:large-map-loading

      - name: Browser camera overlay journey
        run: npm run test:camera-overlay-journey

      - name: Browser day night journey
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run test:day-night-journey 2>&1 | tee artifacts/day-night-journey.log

      - name: Browser dense city population and performance journey
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          node scripts/profile-city-density.mjs 2>&1 | tee artifacts/city-density-journey.log

      - name: Upload gameplay journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-journeys
          path: |
            artifacts/*.png
            artifacts/*.json
            artifacts/*.log
            profile-city-results.json
          if-no-files-found: ignore
