name: Code Verification

on:
  push:
    branches: [ main, develop, feat/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript type check
        run: npx tsc --noEmit
      
      - name: ESLint check
        run: npm run lint
      
      - name: Run tests
        run: npm run test
      
      - name: Fallow - Dead code detection
        run: |
          echo "Checking for unused code with Fallow..."
          npx fallow dead-code --format json > fallow-dead.json || true
          node scripts/fallow-summary.mjs fallow-dead.json || true

      - name: Fallow - Full analysis
        run: |
          echo "Running full Fallow analysis..."
          npx fallow || true
      
      - name: Build check
        run: npm run build

      - name: Install Chromium for gameplay acceptance
        run: npx playwright install --with-deps chromium

      - name: Browser placement journey
        run: npm run test:placement-journey

      - name: Upload placement journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-journey
          path: artifacts/placement-journey.png
          if-no-files-found: ignore
