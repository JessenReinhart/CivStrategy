name: Sync GitHub Project status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/project-status.yml
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to update
        required: true
        type: number
      status:
        description: Project status
        required: true
        type: choice
        options:
          - Backlog
          - Ready
          - In progress
          - In review
          - Done

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      PROJECT_TITLE: CivStrategy
    steps:
      - name: Check project token
        shell: bash
        run: |
          if [ -z "$PROJECTS_TOKEN" ]; then
            echo "::error::Missing PROJECTS_TOKEN. Add a classic PAT with repo + project scopes as a repository secret named PROJECTS_TOKEN."
            exit 1
          fi

      - name: Sync status
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const projectTitle = process.env.PROJECT_TITLE;
            const { owner: repoOwner, repo } = context.repo;

            // Resolve through projects linked to this repository. This avoids
            // Octokit reserved GraphQL variables and works for user/org projects.
            const projectResult = await github.graphql(`
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  projectsV2(first: 50) {
                    nodes {
                      id
                      title
                      fields(first: 100) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner: repoOwner, repo });

            const linkedProjects = projectResult.repository?.projectsV2?.nodes ?? [];
            const exactProject = linkedProjects.find(
              (candidate) => candidate.title?.toLowerCase() === projectTitle.toLowerCase(),
            );
            const project = exactProject ?? (linkedProjects.length === 1 ? linkedProjects[0] : null);

            if (!project) {
              const linkedTitles = linkedProjects.map((candidate) => candidate.title).filter(Boolean);
              core.setFailed(
                linkedTitles.length === 0
                  ? `No GitHub Projects are linked to ${repoOwner}/${repo}. Link the CivStrategy Project to this repository first.`
                  : `GitHub Project '${projectTitle}' was not found among projects linked to ${repoOwner}/${repo}. Linked projects: ${linkedTitles.join(', ')}`,
              );
              return;
            }

            if (!exactProject && linkedProjects.length === 1) {
              core.warning(`Project '${projectTitle}' was not found by title; using the only linked project '${project.title}'.`);
            }
            core.info(`Using GitHub Project '${project.title}' (${project.id}).`);

            const statusField = project.fields.nodes.find(
              (field) => field?.name?.toLowerCase() === 'status' && Array.isArray(field.options),
            );
            if (!statusField) {
              core.setFailed(`Project '${project.title}' has no single-select Status field.`);
              return;
            }

            const normalizeStatus = (status) => status.trim().toLowerCase();
            const statusAliases = {
              Backlog: ['Backlog', 'Todo', 'To do', 'Ready'],
              Ready: ['Ready', 'Backlog', 'Todo', 'To do'],
              'In progress': ['In progress', 'In Progress', 'Doing', 'Active'],
              'In review': ['In review', 'Review', 'In progress', 'In Progress'],
              Done: ['Done', 'Completed', 'Closed'],
            };
            const availableStatuses = statusField.options.map((option) => option.name);
            core.info(`Available project statuses: ${availableStatuses.join(', ')}`);

            const statusOption = (status) => {
              const aliases = statusAliases[status] ?? [status];
              for (const alias of aliases) {
                const option = statusField.options.find(
                  (candidate) => normalizeStatus(candidate.name) === normalizeStatus(alias),
                );
                if (option) {
                  if (normalizeStatus(option.name) !== normalizeStatus(status)) {
                    core.info(`Mapping logical status '${status}' to project status '${option.name}'.`);
                  }
                  return option;
                }
              }
              return null;
            };
            const markerNames = {
              backlog: 'Backlog',
              ready: 'Ready',
              'in-progress': 'In progress',
              'in-review': 'In review',
              done: 'Done',
            };
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            async function findProjectItem(issueNodeId) {
              const result = await github.graphql(`
                query($id: ID!) {
                  node(id: $id) {
                    ... on Issue {
                      projectItems(first: 100, includeArchived: false) {
                        nodes { id project { id } }
                      }
                    }
                  }
                }
              `, { id: issueNodeId });
              return result.node?.projectItems?.nodes?.find(
                (item) => item.project?.id === project.id,
              )?.id;
            }

            async function ensureProjectItem(issueNodeId) {
              let itemId = await findProjectItem(issueNodeId);
              if (itemId) return itemId;

              try {
                const added = await github.graphql(`
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                      item { id }
                    }
                  }
                `, { projectId: project.id, contentId: issueNodeId });
                itemId = added.addProjectV2ItemById.item.id;
              } catch (error) {
                await new Promise((resolve) => setTimeout(resolve, 1500));
                itemId = await findProjectItem(issueNodeId);
                if (!itemId) throw error;
              }
              return itemId;
            }

            async function setIssueStatus(issueNodeId, status) {
              const option = statusOption(status);
              if (!option) {
                throw new Error(
                  `No compatible project status for logical status '${status}' in '${project.title}'. Available statuses: ${availableStatuses.join(', ')}`,
                );
              }
              const itemId = await ensureProjectItem(issueNodeId);
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId: project.id,
                itemId,
                fieldId: statusField.id,
                optionId: option.id,
              });
              core.info(`Set project item ${itemId} to '${option.name}' (logical: '${status}').`);
            }

            async function getIssueNodeId(number) {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) { id }
                  }
                }
              `, { owner: repoOwner, repo, number });
              return result.repository?.issue?.id;
            }

            async function getClosingIssues(prNumber) {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 50) { nodes { id number state } }
                    }
                  }
                }
              `, { owner: repoOwner, repo, number: prNumber });
              return result.repository?.pullRequest?.closingIssuesReferences?.nodes ?? [];
            }

            async function backfillOpenIssues() {
              const items = await github.paginate(github.rest.issues.listForRepo, {
                owner: repoOwner,
                repo,
                state: 'open',
                per_page: 100,
              });
              const issues = items.filter((item) => !item.pull_request);
              const statuses = new Map();

              for (const issue of issues) {
                let status = trustedAssociations.has(issue.author_association) ? 'Ready' : 'Backlog';
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: repoOwner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                });
                for (const comment of comments) {
                  if (!trustedAssociations.has(comment.author_association)) continue;
                  const marker = comment.body?.match(
                    /<!--\s*project-status:(backlog|ready|in-progress|in-review|done)\s*-->/i,
                  );
                  if (marker) status = markerNames[marker[1].toLowerCase()];
                }
                statuses.set(issue.node_id, status);
              }

              const pulls = await github.paginate(github.rest.pulls.list, {
                owner: repoOwner,
                repo,
                state: 'open',
                per_page: 100,
              });
              for (const pr of pulls) {
                const linkedIssues = await getClosingIssues(pr.number);
                const status = pr.draft ? 'In progress' : 'In review';
                for (const issue of linkedIssues) {
                  if (issue.state === 'OPEN') statuses.set(issue.id, status);
                }
              }

              core.info(`Backfilling ${statuses.size} open issue(s) into '${project.title}'.`);
              for (const [id, status] of statuses) {
                await setIssueStatus(id, status);
              }
            }

            const event = context.eventName;
            const action = context.payload.action;
            const updates = [];

            if (event === 'push') {
              await backfillOpenIssues();
              return;
            }

            if (event === 'issues') {
              const trusted = trustedAssociations.has(context.payload.issue.author_association);
              const status = action === 'closed'
                ? 'Done'
                : trusted ? 'Ready' : 'Backlog';
              updates.push({ id: context.payload.issue.node_id, status });
            }

            if (event === 'issue_comment') {
              if (context.payload.issue.pull_request) {
                core.info('Ignoring project-status marker on a pull request comment.');
                return;
              }
              const trusted = trustedAssociations.has(context.payload.comment.author_association);
              if (!trusted) {
                core.info('Ignoring project-status marker from an untrusted commenter.');
                return;
              }

              const marker = context.payload.comment.body?.match(
                /<!--\s*project-status:(backlog|ready|in-progress|in-review|done)\s*-->/i,
              );
              if (!marker) {
                core.info('No project-status marker found.');
                return;
              }
              updates.push({ id: context.payload.issue.node_id, status: markerNames[marker[1].toLowerCase()] });
            }

            if (event === 'pull_request_target') {
              const pr = context.payload.pull_request;
              const linkedIssues = await getClosingIssues(pr.number);
              let status;
              if (action === 'opened' || action === 'ready_for_review') status = 'In review';
              if (action === 'converted_to_draft') status = 'In progress';
              if (action === 'closed') status = pr.merged ? 'Done' : 'In progress';
              for (const issue of linkedIssues) updates.push({ id: issue.id, status });
              if (linkedIssues.length === 0) {
                core.info(`PR #${pr.number} has no closing issue references; nothing to update.`);
              }
            }

            if (event === 'workflow_dispatch') {
              const number = Number(context.payload.inputs.issue_number);
              const issueNodeId = await getIssueNodeId(number);
              if (!issueNodeId) throw new Error(`Issue #${number} was not found.`);
              updates.push({ id: issueNodeId, status: context.payload.inputs.status });
            }

            const deduped = new Map(updates.map((update) => [update.id, update.status]));
            for (const [id, status] of deduped) {
              await setIssueStatus(id, status);
            }
